schema_version: 1
snapshot:
  commit: 79eed10
  tag: legacy-code-snapshot-2026-08-09
  asset_policy: source-only

groups:
  - id: upstream_runtime
    paths: [main.py, diffusion.py, dataloader.py, noise_schedule.py, models, configs]
    target: src/apexoracle_mdlm/models
    phase: M2
    action: retain_then_extract_adapter
  - id: molecule_embedding
    paths: [DBAASP_MLM_MDLM.py, save_DBAASP_id_emb_dict.py, save_synergy_mol_id_emb_dict.py, save_inhouse_synergy_mol_id_emb_dict.py]
    target: src/apexoracle_mdlm/embeddings
    phase: M2
    action: migrate_and_deduplicate
  - id: hierarchical_mic_legacy
    globs: [DP_inhouse_SM_MIC_with_text_genome_test_on_non_seen_*.py]
    target_repository: ApexOracle-Core
    phase: M4
    action: remove_after_source_mapping
  - id: mic_guidance
    globs: [guaidance_regressor_all_data*.py]
    target: src/apexoracle_mdlm/models
    phase: M3
    action: migrate_as_explicit_profiles
  - id: peptide_classifier
    globs: [guaidance_classifier_all_data*.py]
    target: src/apexoracle_mdlm/models
    phase: M3
    action: separate_v1_provenance_from_v2
  - id: synergy_guidance
    globs: [synergy_Evo_train_new_reg_MDLM_one_base_model_all_data_classification*.py]
    target: examples/experimental
    phase: M4
    action: retain_as_experimental
  - id: candidate_scoring
    globs: [judge_generated_mols_*.py, judge_mol_*.py, judge_smi2pep2smi_mol_mic_with_fig.py]
    migrated_and_removed: [temp_predict_mic_from_peptide_csv.py]
    target: src/apexoracle_mdlm/scoring
    phase: M3
    action: canonical_candidate_and_peptide_table_paths_migrated_then_continue_split_library_cli_plotting
  - id: chemistry_legacy
    paths: [DBAASP_semiles_to_SELFEIS.py, aa_seq_to_smiles.py, smiles_to_peptide.py, match_molecules.py]
    target_dependency: PepLink
    phase: M4
    action: retain_only_for_frozen_reproduction
  - id: huggingface_export
    paths: [huggingface, huggingface_push.py]
    phase: M2
    action: audit_revision_weights_license
  - id: debug_and_case_studies
    globs: [debug*.py, temp_*.py, '*.ipynb', p_value_reference.py]
    target: examples_or_snapshot_only
    phase: M4
    action: classify_before_removal

excluded_assets:
  - molecule_data
  - temp_data
  - outputs
  - wandb
  - checkpoints
  - Checkpoints
  - Checkpoints_fangping
  - '*checkpoints*'
  - '*.whl'
  - '*.safetensors'
