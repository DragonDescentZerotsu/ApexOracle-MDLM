[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apexoracle-mdlm"
version = "0.1.0.dev0"
description = "Downstream DLM embedding and guidance support for ApexOracle"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
dependencies = ["torch"]

[project.optional-dependencies]
figure = ["matplotlib", "numpy", "scipy"]
scoring = ["hydra-core", "transformers"]
embedding = ["hydra-core", "selfies", "tqdm", "transformers"]
peptide-table = ["matplotlib", "numpy", "pandas", "rdkit", "selfies"]
small-molecule-screen = ["hydra-core", "matplotlib", "numpy", "selfies", "transformers"]
peptide-screen = ["hydra-core", "pillow", "rdkit", "selfies", "transformers"]

[tool.setuptools.packages.find]
where = ["src"]
